# Long-term S/R backtest (weekly levels, daily execution).
backtest:
  start_date: "2010-01-01"
  end_date: "2015-12-31"
  interval: "1d"
  tickers_file: "/mnt/d/Projects/stock_screener/data/sp500_top50.csv"


engine:
  # Capital & sizing
  initial_capital: 100000.0
  trade_size: 3000.0
  max_alloc_pct: 0.4
  risk_per_trade_pct: 0.005
  portfolio_vol_target: 0.11
  portfolio_vol_lookback: 63
  # Regime/hedge controls
  regime_symbol: "SPY"
  hedge_symbol: "MES=F"
  allow_risk_off_entries: false
  risk_off_size_mult: 0.5
  exit_on_risk_off: true
  allow_short_risk_on: false
  # Execution & liquidity filters
  max_new_positions_per_day: 10
  liquidity_lookback: 20
  min_avg_dollar_vol: 20000000
  min_avg_volume_futures: 1000
  # Cooldowns & stability
  cooldown_days: 5
  regime_stability_days: 4
  breakeven_r: -0.1
  breakeven_delay_bars: 1
  regime_flip_band_pct: 0.0075
  regime_flip_slope_pct: 0.0005
  # Costs & slippage
  commission_per_trade: 0.0
  commission_pct: 0.0002
  slippage_bps: 2.0
  # Dust-trade guards
  min_trade_notional: 0.0
  min_equity_shares: 1
  position_qty_epsilon: 0.000001
  skip_trade_if_notional_lt_min: true
  equity_qty_rounding: "floor_int"
  # Performance toggles
  use_vectorized: true
  # Book allocator (single core sleeve)
  book_allocator:
    total_risk_budget_pct: 0.10
    book_index_floor: 0.05
    core_book_name: "core"
    convex_book_name: "convex"
    portfolio_drawdown_throttle_pct: 0.08
    portfolio_throttle_size_mult: 0.5
    portfolio_throttle_disable_adds: true
    convex_block_if_core_risk_off: true
    books:
      core:
        risk_budget_pct: 1.0
        max_per_trade_risk_pct: 0.10
        max_concurrent_risk_pct: 1.0
        drawdown_reduce_pct: 0.0
        drawdown_disable_pct: 0.0
      convex:
        risk_budget_pct: 0.0
        max_per_trade_risk_pct: 0.0
        max_concurrent_risk_pct: 0.0
        drawdown_reduce_pct: 0.0
        drawdown_disable_pct: 0.0
        recovery_lookback_days: 20

strategy_flags: &strategy_flags
  # Exit toggles
  use_stop_loss: true
  use_fallback_stop: true
  use_take_profit: true
  use_exit_signal: true
  use_time_stop: true
  use_regime_exit: true
  use_breakeven: true
  # Regime overrides
  allow_risk_off_entries: null
  allow_short_risk_on: null
  risk_off_size_mult: null
  require_regime_stability: false
  regime_stability_days: null
  avoid_regime_flip: false
  regime_flip_band_pct: null
  regime_flip_slope_pct: null
  allow_regime_bypass_large_gap: false
  # Breakeven overrides
  breakeven_r: null
  breakeven_delay_bars: null
  # Giveback exits
  giveback_enabled: false
  giveback_trigger_r: 2.0
  giveback_floor_r: 1.0
  giveback_min_days: 0
  # Partial exits
  partial_take_profit_enabled: false
  partial_take_profit_r: 1.0
  partial_take_profit_pct: 0.5
  # Decay exits
  decay_exit_enabled: false
  decay_exit_days: 0
  decay_exit_mfe_r: 0.5
  # Loss cooldown
  loss_cooldown_days: null

strategies:
  - class: LongTermSupportResistanceBreakRetest
    enabled: true
    args:
      <<: *strategy_flags
      book: "core"
      sentiment: "BULLISH"
      direction: "long"
      # Larger position sizing for low-frequency SR trades
      strategy_risk_mult: 2.0
      strategy_trade_size: 12000.0
      strategy_max_position_pct: 0.12
      # Weekly levels, daily execution (no lookahead)
      levels_timeframe: "1w"
      levels_shift: 1
      levels_lookback_weeks: 130
      pivot_left: 3
      pivot_right: 3
      min_touches: 2
      cluster_atr_mult: 0.8
      max_levels: 12
      # Break -> retest entry
      break_buffer_pct: 0.001
      break_confirm_closes: 1
      retest_max_days: 45
      retest_confirm_closes: 1
      # Skip cramped levels
      min_level_distance_atr: 1.5
      # Structure + ATR risk control
      stop_atr_mult: 1.0
      max_stop_atr: 3.0
      time_stop_days: 25
      # Regime stability (avoid knife-catch)
      allow_risk_off_entries: false
      use_regime_exit: true
      require_regime_stability: true
      avoid_regime_flip: true
      # Trend gating
      confirmation_all:
        - "TrendGate"
        - "AboveEmaState20"
      # Armed across regime (break in risk-off, enter on retest in risk-on)
      arm_across_regime: true
      arm_expiry_days: 45
      arm_requires_risk_on_entry: true
      arm_invalidate_on_close_below_level: true
      arm_invalidate_buffer_pct: 0.001
      arm_record_break_metrics: true

  # Confirmation-only helpers (no entries)
  - class: TrendGate
    enabled: true
    args:
      <<: *strategy_flags
      entry_enabled: false
      benchmark_symbol: "SPY"
      lookback_days: 126
      min_relative_return_pct: 0.0
      min_rank_percentile: 0.65
      ema_length: 50
      slope_lookback: 20
      slope_min: 0.0
      confirmation_lookback_days: 0
      sentiment: "BULLISH"
      direction: "long"

  - class: AboveEmaState20
    enabled: true
    args:
      <<: *strategy_flags
      entry_enabled: false
      ema_length: 20
      confirmation_lookback_days: 0
      consecutive_closes: 1
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
