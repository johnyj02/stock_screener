# WaveTrend on the locally refreshed SI=F 5-minute yfinance cache.
backtest:
  start_date: "2026-07-10"
  end_date: "2026-09-04"
  interval: "5m"
  tickers: ["SI=F"]
  engine:
    initial_capital: 100000.0
    trade_size: 100000.0
    max_alloc_pct: 0.6
    # Whole SI contracts require a larger sizing budget than equities.
    risk_per_trade_pct: 0.05
    futures_margin_pct: 0.1
    regime_symbol: "SI=F"
    hedge_symbol: ""
    allow_risk_off_entries: true
    exit_on_risk_off: false
    cooldown_days: 0
    min_avg_dollar_vol: 0.0
    min_avg_volume_futures: 0.0
    commission_pct: 0.0002
    slippage_bps: 2.0
    use_vectorized: true
    force_update_cache: false

strategies:
  - class: WaveTrendCross
    enabled: true
    args:
      direction: "long"
      use_stop_loss: false
      # Enables risk sizing only; it cannot trigger a stop exit.
      use_fallback_stop: true
      use_take_profit: false
      use_exit_signal: true
      use_time_stop: false
      use_regime_exit: false
      use_breakeven: false
      time_stop_days: null

charts:
  enabled: true
  mode: post
  include_full: true
  per_position: false
  tickers: traded_only
  include_volume: true
  include_rsi: false
  format: png
