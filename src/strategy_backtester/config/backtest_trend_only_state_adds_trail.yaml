# Trend-only backtest config (decay + strict EMA50 state + later add-ons + trailing).
backtest:
  start_date: "2020-01-01"
  end_date: "2025-12-31"
  interval: "1d"
  tickers_file: "/mnt/d/Projects/stock_screener/src/strategy_grid_search/data/sp500.csv"

  # Engine sizing, risk, and execution controls
  engine:
    # Capital & sizing
    initial_capital: 100000.0
    trade_size: 3000.0
    max_alloc_pct: 0.4
    risk_per_trade_pct: 0.005
    portfolio_vol_target: 0.11
    portfolio_vol_lookback: 63
    # Regime/hedge controls (risk-on required for longs)
    regime_symbol: "SPY"
    hedge_symbol: "MES=F"
    allow_risk_off_entries: false
    risk_off_size_mult: 0.5
    exit_on_risk_off: true
    allow_short_risk_on: false
    # Execution & liquidity filters
    max_new_positions_per_day: 20
    liquidity_lookback: 20
    min_avg_dollar_vol: 20000000
    min_avg_volume_futures: 1000
    # Cooldowns & stability
    cooldown_days: 5
    regime_stability_days: 4
    breakeven_r: -0.1
    breakeven_delay_bars: 1
    regime_flip_band_pct: 0.0075
    regime_flip_slope_pct: 0.0005
    # Costs & slippage
    commission_per_trade: 0.0
    commission_pct: 0.0
    slippage_bps: 0.0
    # Dust-trade guards
    min_trade_notional: 0.0
    min_equity_shares: 1
    position_qty_epsilon: 0.000001
    skip_trade_if_notional_lt_min: true
    equity_qty_rounding: "floor_int"
    # Performance toggles
    use_vectorized: true

strategy_flags: &strategy_flags
  # Exit toggles
  use_stop_loss: true
  use_fallback_stop: true
  use_take_profit: true
  use_exit_signal: true
  use_time_stop: true
  use_regime_exit: true
  use_breakeven: true
  # Regime overrides
  allow_risk_off_entries: null
  allow_short_risk_on: null
  risk_off_size_mult: null
  require_regime_stability: false
  regime_stability_days: null
  avoid_regime_flip: false
  regime_flip_band_pct: null
  regime_flip_slope_pct: null
  allow_regime_bypass_large_gap: false
  # Breakeven overrides
  breakeven_r: null
  breakeven_delay_bars: null
  # Giveback exits
  giveback_enabled: false
  giveback_trigger_r: 2.0
  giveback_floor_r: 1.0
  giveback_min_days: 0
  # Partial exits
  partial_take_profit_enabled: false
  partial_take_profit_r: 1.0
  partial_take_profit_pct: 0.5
  # Decay exits
  decay_exit_enabled: false
  decay_exit_days: 0
  decay_exit_mfe_r: 0.5
  # Loss cooldown
  loss_cooldown_days: null

# Trend strategies + confirmation-only helpers
strategies:
  - class: PullbackToEma
    enabled: true
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: null
      time_stop_days: 15
      use_take_profit: false
      # Exit weak trends quickly
      decay_exit_enabled: true
      decay_exit_days: 7
      decay_exit_mfe_r: 0.5
      # Trail winners instead of hard TP
      trailing_enabled: true
      trailing_start_r: 1.0
      trailing_use_mmt: false
      trailing_use_avwap: false
      trailing_use_ema20: true
      trailing_method: "max"
      trailing_ema_length: 20
      # Confirm trend state (EMA50 above + slope > 0)
      confirmation_all:
        - "AboveEmaState50"
      # Trend pyramiding (later + fewer)
      addons_enabled: true
      max_adds: 1
      add_size_pct_initial: 0.5
      add_min_peak_r: 1.5
      add_min_days_since_entry: 5
      add_min_bars_between_adds: 10
      add_only_if_above_trail: true
      add_requires_trend_confirm: false
      add_requires_ema_length: 50

  - class: FlagPennantContinuation
    enabled: true
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: null
      time_stop_days: null
      # Confirm trend + breakout volume
      confirmation_all:
        - "CloseAboveEma20"
        - "VolumeSpike"
      # Trend pyramiding (later + fewer)
      addons_enabled: true
      max_adds: 1
      add_size_pct_initial: 0.5
      add_min_peak_r: 1.5
      add_min_days_since_entry: 5
      add_min_bars_between_adds: 10
      add_only_if_above_trail: true
      add_requires_trend_confirm: false
      add_requires_ema_length: 20

  - class: TriangleBreakout
    enabled: true
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: null
      time_stop_days: null
      # Confirm trend + breakout volume
      confirmation_all:
        - "CloseAboveEma20"
        - "VolumeSpike"
      # Trend pyramiding (later + fewer)
      addons_enabled: true
      max_adds: 1
      add_size_pct_initial: 0.5
      add_min_peak_r: 1.5
      add_min_days_since_entry: 5
      add_min_bars_between_adds: 10
      add_only_if_above_trail: true
      add_requires_trend_confirm: false
      add_requires_ema_length: 20

  - class: SupportResistanceBreakRetest
    enabled: true
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: null
      time_stop_days: null
      # Confirm trend state (EMA20 reclaim)
      confirmation_all:
        - "CloseAboveEma20"
      # Trend pyramiding (later + fewer)
      addons_enabled: true
      max_adds: 1
      add_size_pct_initial: 0.5
      add_min_peak_r: 1.5
      add_min_days_since_entry: 5
      add_min_bars_between_adds: 10
      add_only_if_above_trail: true
      add_requires_trend_confirm: false
      add_requires_ema_length: 20

  # Confirmation-only helpers (no entries)
  - class: AboveEmaState50
    enabled: true
    args:
      <<: *strategy_flags
      entry_enabled: false
      confirmation_lookback_days: 0
      consecutive_closes: 1
      slope_lookback: 1
      slope_min: 0.0
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0

  - class: CloseAboveEma20
    enabled: true
    args:
      <<: *strategy_flags
      entry_enabled: false
      confirmation_lookback_days: 3
      consecutive_closes: 1
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0

  - class: VolumeSpike
    enabled: true
    args:
      <<: *strategy_flags
      entry_enabled: false
      confirmation_lookback_days: 0
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: 3.0
      time_stop_days: null
