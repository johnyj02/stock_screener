# Combined experiment: deploy + turnover filters + costs + shorts.
# Combined experiment config: deploy + turnover filters + costs + shorts + core strategies
# Backtest range & data source
backtest:
  start_date: "2020-01-01"
  end_date: "2025-12-31"
  interval: "1d"
  tickers_file: "/mnt/d/Projects/stock_screener/src/strategy_grid_search/data/sp500.csv"

  # tickers:
  #   - "AAPL"
  #   - "MSFT"
  # Engine sizing, risk, and execution controls
  engine:
    # Capital & sizing
    initial_capital: 100000.0
    trade_size: 6000.0
    max_alloc_pct: 0.9
    risk_per_trade_pct: 0.005
    portfolio_vol_target: 0.11
    portfolio_vol_lookback: 63
    # Regime/hedge controls
    regime_symbol: "SPY"
    hedge_symbol: "MES=F"
    allow_risk_off_entries: false
    risk_off_size_mult: 0.5
    exit_on_risk_off: true
    allow_short_risk_on: false
    # Execution & liquidity filters
    max_new_positions_per_day: 20
    liquidity_lookback: 20
    min_avg_dollar_vol: 20000000
    min_avg_volume_futures: 1000
    # Cooldowns & stability
    cooldown_days: 5
    regime_stability_days: 4
    breakeven_r: -0.1
    breakeven_delay_bars: 1
    regime_flip_band_pct: 0.0075
    regime_flip_slope_pct: 0.0005
    # Costs & slippage
    commission_per_trade: 0.0
    commission_pct: 0.0005
    slippage_bps: 2.0
    # Dust-trade guards
    min_trade_notional: 200.0
    min_equity_shares: 1
    position_qty_epsilon: 0.000001
    skip_trade_if_notional_lt_min: true
    equity_qty_rounding: "floor_int"
    # Performance toggles
    use_vectorized: true

strategy_flags: &strategy_flags
  # Exit toggles
  use_stop_loss: true
  use_fallback_stop: true
  use_take_profit: true
  use_exit_signal: true
  use_time_stop: true
  use_regime_exit: true
  use_breakeven: true
  # Regime overrides
  allow_risk_off_entries: null
  allow_short_risk_on: null
  risk_off_size_mult: null
  require_regime_stability: false
  regime_stability_days: null
  avoid_regime_flip: false
  regime_flip_band_pct: null
  regime_flip_slope_pct: null
  allow_regime_bypass_large_gap: false
  # Breakeven overrides
  breakeven_r: null
  breakeven_delay_bars: null
  # Giveback exits
  giveback_enabled: false
  giveback_trigger_r: 2.0
  giveback_floor_r: 1.0
  giveback_min_days: 0
  # Partial exits
  partial_take_profit_enabled: false
  partial_take_profit_r: 1.0
  partial_take_profit_pct: 0.5
  # Decay exits
  decay_exit_enabled: false
  decay_exit_days: 0
  decay_exit_mfe_r: 0.5
  # Loss cooldown
  loss_cooldown_days: null

# Strategy list and per-strategy overrides
strategies:
  - class: PullbackToEma
    enabled: false
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: 3.0
      time_stop_days: 15
      require_sma200_trend: true
      require_ema50_trend: true
      min_atr_pct: 0.01
      min_pullback_dist_pct: 0.2
      max_pullback_dist_pct: 0.8
      loss_cooldown_days: 10
      require_regime_stability: true
      avoid_regime_flip: true
  - class: BullishEngulfing
    enabled: true
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: 2.0
      time_stop_days: 10
  - class: VptBreakout
    enabled: true
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: 4.0
      time_stop_days: null
  - class: GoldenCross
    enabled: false
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: null
      time_stop_days: null
  - class: MacdTurnaround
    enabled: true
    args:
      <<: *strategy_flags
      sentiment: "BULLISH"
      direction: "long"
      stop_multiplier: 2.0
      take_profit_multiplier: 3.0
      time_stop_days: null
