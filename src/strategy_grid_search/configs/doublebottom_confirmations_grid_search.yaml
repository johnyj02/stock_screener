trial_name: "doublebottom_confirmations"
base_config: "src/strategy_backtester/config/backtest_doublebottom_confirmations.yaml"

metrics_registry: "src/strategy_grid_search/examples/metrics_registry.yaml"

params:
  # DoubleBottom core pattern parameters
  DoubleBottomRsiDivergence.lookback:
    values: [60, 90, 120, 150]
  DoubleBottomRsiDivergence.pivot_left:
    values: [2, 3, 4, 5]
  DoubleBottomRsiDivergence.pivot_right:
    values: [2, 3, 4, 5]
  DoubleBottomRsiDivergence.trough_tolerance_pct:
    range: {min: 0.01, max: 0.06, step: 0.01}
  DoubleBottomRsiDivergence.break_buffer_pct:
    range: {min: 0.0, max: 0.006, step: 0.001}
  DoubleBottomRsiDivergence.trough_buffer_atr:
    range: {min: 0.05, max: 0.3, step: 0.05}
  DoubleBottomRsiDivergence.rsi_length:
    values: [10, 14, 18, 21]
  DoubleBottomRsiDivergence.rsi_divergence_min:
    range: {min: 1.0, max: 6.0, step: 0.5}
  DoubleBottomRsiDivergence.rsi_exit_threshold:
    values: [null, 60.0, 65.0, 70.0, 75.0]
  DoubleBottomRsiDivergence.volume_lookback:
    values: [10, 20, 30]
  DoubleBottomRsiDivergence.volume_break_ratio:
    range: {min: 1.2, max: 2.0, step: 0.1}

  # Stops, partials, and time exits
  DoubleBottomRsiDivergence.stop_multiplier:
    range: {min: 1.0, max: 2.5, step: 0.25}
  DoubleBottomRsiDivergence.partial_take_profit_enabled:
    values: [true, false]
  DoubleBottomRsiDivergence.partial_take_profit_mode:
    values: ["take_profit", "r_multiple"]
  DoubleBottomRsiDivergence.partial_take_profit_r:
    values: [0.5, 1.0, 1.5]
  DoubleBottomRsiDivergence.partial_take_profit_pct:
    values: [0.2, 0.3, 0.4, 0.5]
  DoubleBottomRsiDivergence.time_stop_days:
    values: [null, 10, 20, 30]
  DoubleBottomRsiDivergence.strategy_max_position_pct:
    range: {min: 0.05, max: 0.5, step: 0.05}

  # Trailing & trend confirmation
  DoubleBottomRsiDivergence.trailing_enabled:
    values: [true, false]
  DoubleBottomRsiDivergence.trailing_start_r:
    values: [0.75, 1.0, 1.25, 1.5, 2.0]
  DoubleBottomRsiDivergence.trailing_method:
    values: ["max", "min"]
  DoubleBottomRsiDivergence.trailing_use_mmt:
    values: [true, false]
  DoubleBottomRsiDivergence.trailing_use_avwap:
    values: [true, false]
  DoubleBottomRsiDivergence.trailing_use_ema20:
    values: [true, false]
  DoubleBottomRsiDivergence.trailing_ema_length:
    values: [10, 20, 30, 50]
  DoubleBottomRsiDivergence.trailing_atr_mult:
    range: {min: 0.0, max: 1.0, step: 0.25}
  DoubleBottomRsiDivergence.trend_confirm_enabled:
    values: [true, false]
  DoubleBottomRsiDivergence.trend_confirm_mode:
    values: ["either", "all"]
  DoubleBottomRsiDivergence.trend_confirm_consecutive_closes:
    values: [1, 2, 3]
  DoubleBottomRsiDivergence.trend_confirm_lookback_days:
    values: [3, 5, 7, 10]
  DoubleBottomRsiDivergence.trend_trailing_method:
    values: ["ema", "atr"]
  DoubleBottomRsiDivergence.trend_trailing_ema_length:
    values: [20, 50, 100]
  DoubleBottomRsiDivergence.trend_trailing_atr_mult:
    values: [0.0, 0.5, 1.0]

  # Exhaustion exits
  DoubleBottomRsiDivergence.exhaustion_enabled:
    values: [true, false]
  DoubleBottomRsiDivergence.exhaustion_min_signals:
    values: [1, 2, 3]
  DoubleBottomRsiDivergence.exhaustion_rsi_level:
    values: [65.0, 70.0, 75.0]
  DoubleBottomRsiDivergence.exhaustion_rsi_rollover_bars:
    values: [1, 2, 3]
  DoubleBottomRsiDivergence.exhaustion_candle_close_loc:
    values: [0.3, 0.4, 0.5]
  DoubleBottomRsiDivergence.exhaustion_resistance_lookback:
    values: [20, 40, 60]
  DoubleBottomRsiDivergence.exhaustion_resistance_atr_mult:
    values: [0.2, 0.4, 0.6]
  DoubleBottomRsiDivergence.exhaustion_volume_ratio:
    values: [0.8, 0.9, 1.0]
  DoubleBottomRsiDivergence.exhaustion_stall_atr_mult:
    values: [0.1, 0.25, 0.4]
  DoubleBottomRsiDivergence.exhaustion_require_near_or_mmt:
    values: [true, false]
  DoubleBottomRsiDivergence.exhaustion_disable_after_trend_confirm:
    values: [true, false]

  # Add-ons
  DoubleBottomRsiDivergence.addons_enabled:
    values: [true, false]
  DoubleBottomRsiDivergence.max_adds:
    values: [0, 1, 2]
  DoubleBottomRsiDivergence.add_size_pct_initial:
    values: [0.25, 0.5, 0.75]
  DoubleBottomRsiDivergence.add_min_peak_r:
    values: [1.0, 1.5, 2.0]
  DoubleBottomRsiDivergence.add_min_days_since_entry:
    values: [2, 3, 5]
  DoubleBottomRsiDivergence.add_only_if_above_trail:
    values: [true, false]
  DoubleBottomRsiDivergence.add_requires_trend_confirm:
    values: [true, false]
  DoubleBottomRsiDivergence.add_requires_trend_confirm_bars:
    values: [1, 2, 3]
  DoubleBottomRsiDivergence.add_requires_confirmations:
    values: [true, false]
  DoubleBottomRsiDivergence.add_min_bars_between_adds:
    values: [0, 1, 2]
  DoubleBottomRsiDivergence.add_requires_ema_length:
    values: [null, 20, 50]

  # Confirmation logic
  DoubleBottomRsiDivergence.confirmation_any:
    values:
      - ["BullishEngulfing"]
      - ["RsiOversold"]
      - ["CloseAboveEma20"]
      - ["BullishEngulfing", "RsiOversold"]
      - ["BullishEngulfing", "CloseAboveEma20"]
      - ["RsiOversold", "CloseAboveEma20"]
      - ["BullishEngulfing", "RsiOversold", "CloseAboveEma20"]
      - null
  DoubleBottomRsiDivergence.confirmation_all:
    values:
      - ["CloseAboveEma20"]
      - ["BullishEngulfing"]
      - ["RsiOversold"]
      - ["CloseAboveEma20", "BullishEngulfing"]
      - null
  DoubleBottomRsiDivergence.confirmation_lookback_days:
    values: [3, 5, 7, 10]

  # Confirmation helper strategy knobs
  RsiOversold.confirmation_lookback_days:
    values: [3, 5, 10]
  RsiOversold.require_sma200_trend:
    values: [true, false]
  BullishEngulfing.confirmation_lookback_days:
    values: [2, 3, 5]
  BullishEngulfing.require_sma50_trend:
    values: [true, false]
  CloseAboveEma20.confirmation_lookback_days:
    values: [2, 3, 5]
  CloseAboveEma20.consecutive_closes:
    values: [1, 2, 3]
  CloseAboveEma20.require_cross:
    values: [true, false]
  CloseAboveEma20.require_sma200:
    values: [true, false]
  CloseAboveEma20.ema_length:
    values: [10, 20, 30, 50]
  CloseAboveEma20.slope_lookback:
    values: [0, 3, 5, 10]
  CloseAboveEma20.slope_min:
    values: [0.0, 0.01, 0.02]

  # Engine-level tuning
  engine.risk_per_trade_pct:
    range: {min: 0.0025, max: 0.1, step: 0.0025}
  engine.max_alloc_pct:
    range: {min: 0.2, max: 0.9, step: 0.05}
  engine.regime_stability_days:
    values: [0, 2, 4, 6, 8]
  engine.breakeven_r:
    range: {min: -0.2, max: 1.0, step: 0.1}
  engine.breakeven_delay_bars:
    values: [0, 1, 2, 3, 5]
  engine.min_avg_volume_futures:
    values: [0, 500, 1000, 2000, 5000]
  engine.allow_risk_off_entries:
    values: [true, false]
  engine.risk_off_size_mult:
    values: [0.25, 0.5, 0.75, 1.0]
  engine.exit_on_risk_off:
    values: [true, false]
  engine.allow_short_risk_on:
    values: [true, false]
  engine.allow_short_equity:
    values: [true, false]
  engine.portfolio_vol_target:
    values: [0.06, 0.08, 0.1, 0.12, 0.14, 0.16, 0.18]
  engine.portfolio_vol_lookback:
    values: [42, 63, 84, 126]
  engine.regime_flip_band_pct:
    range: {min: 0.0025, max: 0.02, step: 0.0025}
  engine.regime_flip_slope_pct:
    range: {min: 0.0001, max: 0.0019, step: 0.0002}

  # Regime model tuning
  engine.regime.params.risk_on_threshold:
    path: backtest.engine.regime.params.risk_on_threshold
    range: {min: 0.5, max: 0.7, step: 0.05}
  engine.regime.params.hysteresis_on:
    path: backtest.engine.regime.params.hysteresis_on
    values: [0.6, 0.65, 0.7]
  engine.regime.params.hysteresis_off:
    path: backtest.engine.regime.params.hysteresis_off
    values: [0.5, 0.55, 0.6]
  engine.regime.params.hedge_max_pct:
    path: backtest.engine.regime.params.hedge_max_pct
    range: {min: 0.2, max: 0.6, step: 0.1}
  engine.regime.params.risk_mult_buckets:
    path: backtest.engine.regime.params.risk_mult_buckets
    values:
      - [{min: 0.8, mult: 1.0}, {min: 0.6, mult: 0.7}, {min: 0.4, mult: 0.4}, {min: 0.0, mult: 0.0}]
      - [{min: 0.8, mult: 1.0}, {min: 0.6, mult: 0.8}, {min: 0.4, mult: 0.5}, {min: 0.0, mult: 0.0}]
      - [{min: 0.85, mult: 1.0}, {min: 0.65, mult: 0.7}, {min: 0.45, mult: 0.35}, {min: 0.0, mult: 0.0}]
  engine.regime.params.apply_exposure_caps:
    path: backtest.engine.regime.params.apply_exposure_caps
    values: [false, true]

objectives:
  - metric: total_return_pct
    direction: maximize
    weight: 0.7
  - metric: sharpe_ratio
    direction: maximize
    weight: 0.2
  - metric: max_drawdown_pct
    direction: minimize
    weight: 0.09
  - metric: turnover_pct
    direction: minimize
    weight: 0.01

search:
  total_trials: 170
  random_pct: 0.75
  parallel_workers: 20
  seed: 42
  resume: true
  drawdown_cap_pct: 15.0
  optuna:
    enabled: true
    sampler: tpe
    n_startup_trials: 0
    n_jobs: 1

walk_forward:
  mode: rolling
  train_days: 252
  test_days: 21
  step_days: 42
  purge_days: 20
  embargo_days: 1
  max_walks: null
  train_min_days: null
  train_max_days: null
  resume_train: false
  fallback_short_window:
    enabled: true
    min_required_days: null
    train_days: 30
    test_days: 10
    step_days: 10
  constraints:
    min_trades: null
    drawdown_cap_pct: 15.0
    max_turnover_pct: null
  selection:
    candidate_pool_size: 50
    ensemble_size: 5
    min_param_distance: 0.1
    corr_threshold: 0.8
    corr_threshold_step: 0.05
    corr_threshold_max: 0.9
    weighting: equal
    max_weight_mult: 2.0
  warm_start:
    enabled: true
    seed_top_k: 20
    perturbations_per_seed: 2
    exploration_pct: 0.75
    global_bank_max: 100
  search_overrides:
    random_pct: 0.75
    quick_eval:
      enabled: true
      train_fraction: 0.3
      keep_pct: 0.3
    optuna:
      n_startup_trials: 0
      pruner:
        type: median
        n_startup_trials: 10
        n_warmup_steps: 0
        interval_steps: 1

output:
  save_runs: false
  top_n: 30
